name: Video idea
description: Add a row to video-ideas.xlsx
title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Submitting this adds a row to `video-ideas.xlsx` and closes the issue.
        Keep "My take" and "Best moments" in your own words, copied from your riff transcript.
  - type: input
    id: working_title
    attributes:
      label: Working title
    validations:
      required: true
  - type: dropdown
    id: topic_area
    attributes:
      label: Topic area
      options:
        - Games
        - Entertainment
        - Fictional worlds
        - Personal observation
        - School / everyday life
        - Other
  - type: dropdown
    id: status
    attributes:
      label: Status
      default: 0
      options:
        - riff pending
        - riff recorded
        - scripting
        - recording
        - animating
        - rendered
        - published
        - parked
  - type: dropdown
    id: origin
    attributes:
      label: Origin
      options:
        - own observation
        - something watched or played
        - a question
        - a conversation
        - other
  - type: textarea
    id: my_take
    attributes:
      label: My take
      description: Your opinion, in your own words.
  - type: textarea
    id: best_moments
    attributes:
      label: Best moments
      description: The strongest lines or beats from your riff.
  - type: input
    id: hook_idea
    attributes:
      label: Hook idea
  - type: dropdown
    id: riff_recorded
    attributes:
      label: Riff recorded
      default: 1
      options:
        - "yes"
        - "no"
  - type: dropdown
    id: script_status
    attributes:
      label: Script status
      options:
        - not started
        - outlined
        - drafted
        - final
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "1"
        - "2"
        - "3"
  - type: textarea
    id: notes
    attributes:
      label: Notes
