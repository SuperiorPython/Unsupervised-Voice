name: Weekly channel report

# Runs a plain Python script (no AI, no tokens). Needs the repo secret YT_API_KEY.
on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays, 13:00 UTC (8am Eastern in winter, 9am in summer)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the report
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_HANDLE: unsupervisedvoice
        run: python scripts/weekly_report.py

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Weekly channel report"
            git push
          fi
