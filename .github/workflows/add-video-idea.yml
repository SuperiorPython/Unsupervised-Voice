name: Add video idea to tracker

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# one idea at a time, so two quick submissions can't overwrite each other
concurrency:
  group: video-ideas-tracker
  cancel-in-progress: false

jobs:
  add-row:
    # Only the repo owner's idea forms can write to the tracker.
    if: startsWith(github.event.issue.title, '[Idea]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Add the row
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/add_video_idea.py

      - name: Refresh the README table
        run: python scripts/render_readme.py

      - name: Commit the tracker and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video-ideas.xlsx README.md
          git commit -m "Add video idea ${{ steps.add.outputs.id }} (from issue #${{ github.event.issue.number }})"
          git push

      - name: Confirm and close the issue
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Added to video-ideas.xlsx as id ${{ steps.add.outputs.id }} (row ${{ steps.add.outputs.row }})."
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Report a failure
        if: failure()
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Couldn't add this idea to the tracker. See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
